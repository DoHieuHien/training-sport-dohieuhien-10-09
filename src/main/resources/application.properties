spring.application.name=training-sport
server.port=8081

spring.mongodb.uri=mongodb://localhost:27017/training_sport

spring.cloud.openfeign.client.config.openligadb.connect-timeout=5000
spring.cloud.openfeign.client.config.openligadb.read-timeout=30000
spring.cloud.openfeign.client.config.openligadb.logger-level=basic

openligadb.base-url=https://api.openligadb.de

logging.level.com.dohieuhien.ojt.trainingsport.client=DEBUG 